<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estadísticas · Copa LucasPazo27</title>
<meta name="description" content="Buscá tu nick de HaxBall y mirá tus estadísticas, compará jugadores y explorá los rankings de la Copa LucasPazo27.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C0F; --bg2:#12161B; --bg3:#1B2027; --card:#15191F; --line:#282E36;
    --ink:#EDE8DC; --muted:#9C968A;
    --a1:#FF2E9A; --a1b:#FF7EDB; --a2:#00E5FF; --gold:#FFD60A;
    --win:#39FF14; --draw:#FFD60A; --lose:#FF3366;
    --a1-rgb:255,46,154; --a2-rgb:0,229,255;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    min-height:100vh; min-height:100dvh;
    background:
      radial-gradient(700px 420px at 10% 0%, rgba(var(--a1-rgb),.16), transparent 60%),
      radial-gradient(600px 400px at 92% 6%, rgba(var(--a2-rgb),.12), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink); font-family:'IBM Plex Sans',sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 16px 80px}
  a{color:inherit}
  button{font-family:inherit}
  .back{display:inline-flex;align-items:center;gap:6px;margin:18px 0 0;font-size:14px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--a2)}
  header{text-align:center;padding:18px 0 14px}
  .kicker{font-family:'Bebas Neue',sans-serif;letter-spacing:.18em;font-size:18px;color:var(--a2)}
  h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(40px,9vw,64px);line-height:1;margin:2px 0 6px;letter-spacing:.02em}
  h1 span{color:var(--a1)}
  .sub{color:var(--muted);font-size:15px;margin:0}

  /* buscador */
  .search{position:relative;margin:14px 0 6px}
  .search input{
    width:100%;font:inherit;font-size:19px;padding:15px 48px 15px 50px;color:var(--ink);
    background:var(--card);border:2px solid var(--line);border-radius:16px;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search input::placeholder{color:#6f6a60}
  .search input:focus{border-color:var(--a1);box-shadow:0 0 0 4px rgba(var(--a1-rgb),.18)}
  .search .ic{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:20px;pointer-events:none}
  .search .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;
    background:var(--bg2);color:var(--muted);font-size:16px;cursor:pointer;display:none}
  .search.has .clr{display:block}
  .sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--card);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.55);display:none}
  .sug.on{display:block}
  .sug button{display:flex;width:100%;align-items:center;gap:10px;padding:13px 16px;border:0;background:none;color:var(--ink);
    font-size:17px;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
  .sug button:last-child{border-bottom:0}
  .sug button:hover,.sug button.sel{background:rgba(var(--a1-rgb),.14)}
  .sug .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sug .p{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted)}
  .sug .none{padding:14px 16px;color:var(--muted)}
  .status{min-height:20px;font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}
  .status.err{color:var(--lose)}

  /* pestañas */
  .tabs{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:6px 16px;scrollbar-width:none;position:sticky;top:0;z-index:30;
    background:linear-gradient(var(--bg) 70%, transparent)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:15px;font-weight:600;padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{background:rgba(var(--a1-rgb),.18);border-color:var(--a1);color:var(--a1b)}
  .tab[disabled]{opacity:.4;cursor:not-allowed}

  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 16px;margin-top:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .sec{font-family:'Bebas Neue',sans-serif;letter-spacing:.08em;font-size:22px;color:var(--a2);margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .sec small{font-family:'IBM Plex Sans',sans-serif;font-size:12px;letter-spacing:0;color:var(--muted);font-weight:400}
  .row2{display:grid;gap:14px}
  @media(min-width:700px){.row2{grid-template-columns:1fr 1fr}}
  .btn{font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);cursor:pointer}
  .btn:hover{border-color:var(--a2);color:var(--a2)}
  .btn.pri{background:rgba(var(--a1-rgb),.2);border-color:var(--a1);color:var(--a1b)}
  .muted{color:var(--muted)}

  /* carta */
  .fut{position:relative;border-radius:22px;padding:18px 16px 16px;overflow:hidden;border:1px solid rgba(255,214,10,.5);
    background:linear-gradient(135deg,rgba(255,214,10,.16),rgba(var(--a1-rgb),.14) 55%,rgba(var(--a2-rgb),.14));margin-top:14px}
  .fut::after{content:"";position:absolute;inset:0;background:radial-gradient(400px 160px at 85% -10%,rgba(255,255,255,.12),transparent 70%);pointer-events:none}
  .fut-top{display:flex;gap:14px;align-items:center}
  .rating{flex:0 0 auto;text-align:center;line-height:1}
  .rating b{display:block;font-family:'Bebas Neue',sans-serif;font-size:64px;color:var(--gold);text-shadow:0 0 18px rgba(255,214,10,.35)}
  .rating span{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.08em;color:var(--a2)}
  .rating i{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px;cursor:help}
  .pname{font-family:'Bebas Neue',sans-serif;font-size:clamp(34px,8vw,52px);line-height:1.02;margin:0;word-break:break-word}
  .badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .badge{font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
  .badge.pts{border-color:rgba(var(--a1-rgb),.6);color:var(--a1b)}
  .badge.pos{border-color:rgba(var(--a2-rgb),.55);color:var(--a2)}
  .fut-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  @media(min-width:560px){.fut-stats{grid-template-columns:repeat(6,1fr)}}
  .fs{background:rgba(0,0,0,.32);border-radius:12px;padding:8px 6px;text-align:center}
  .fs b{display:block;font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1.05}
  .fs span{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .chip{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(255,214,10,.12);border:1px solid rgba(255,214,10,.4);color:var(--gold)}
  .chip.c2{background:rgba(var(--a2-rgb),.1);border-color:rgba(var(--a2-rgb),.4);color:var(--a2)}
  .chip.c1{background:rgba(var(--a1-rgb),.12);border-color:rgba(var(--a1-rgb),.45);color:var(--a1b)}

  /* gráficos */
  svg{display:block;max-width:100%}
  .radar text{fill:var(--ink);font-size:11.5px;font-family:'IBM Plex Sans',sans-serif}
  .radar .rg{fill:none;stroke:var(--line);stroke-width:1}
  .radar .ax{stroke:var(--line);stroke-width:1}
  .radar .pt{cursor:pointer;transition:r .12s}
  .radar .pt:hover{r:7}
  .legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:14px;margin-top:6px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
  .donut circle.seg{cursor:pointer;transition:stroke-width .15s}
  .donut circle.seg:hover{stroke-width:20}
  .donut text{fill:var(--ink);font-family:'Bebas Neue',sans-serif}
  .dl{display:grid;gap:8px;font-size:16px}
  .dl div{display:flex;align-items:center;gap:8px}
  .dl b{font-family:'IBM Plex Mono',monospace;margin-left:auto;padding-left:14px}
  .dl i{width:12px;height:12px;border-radius:3px;display:inline-block}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
  .tile{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px;text-align:center}
  .tile .e{font-size:20px;line-height:1}
  .tile .v{display:block;font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1.05;margin-top:2px}
  .tile.big .v{color:var(--a1b)}
  .tile .l{display:block;font-size:13px;color:var(--muted)}
  .tile .r{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(var(--a2-rgb),.14);color:var(--a2)}
  .tile .r.top3{background:rgba(255,214,10,.16);color:var(--gold)}
  .meter{position:relative;height:7px;border-radius:999px;background:var(--bg3);margin:9px 2px 3px;overflow:visible}
  .meter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--a1),var(--a2));width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .meter u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.75;border-radius:2px}
  .tile .avg{font-size:11px;color:var(--muted)}
  .hint-line{font-size:12px;color:var(--muted);margin-top:10px}

  .near{display:grid;gap:6px}
  .near button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:16px;text-align:left;cursor:pointer}
  .near button:hover{border-color:var(--a1)}
  .near button.me{border-color:var(--a1);background:rgba(var(--a1-rgb),.14);cursor:default}
  .near .no{font-family:'Bebas Neue',sans-serif;font-size:22px;width:36px;color:var(--a2);text-align:center}
  .near .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .near .pt{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--a1b)}

  /* comparar */
  .cmpbar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
  .cp{border-radius:14px;padding:12px;text-align:center;border:1px solid var(--line);background:var(--bg2);min-width:0}
  .cp.a{border-color:rgba(var(--a1-rgb),.6)} .cp.b{border-color:rgba(var(--a2-rgb),.6)}
  .cp b{display:block;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cp.a b{color:var(--a1b)} .cp.b b{color:var(--a2)}
  .cp span{font-size:12px;color:var(--muted)}
  .vs{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--muted)}
  .pickb{margin-top:12px;position:relative}
  .pickb input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);outline:none}
  .pickb input:focus{border-color:var(--a2)}
  .pickb .sug{top:calc(100% + 4px)}
  .score{display:flex;justify-content:center;align-items:baseline;gap:14px;margin:14px 0 4px;font-family:'Bebas Neue',sans-serif}
  .score b{font-size:56px;line-height:1}
  .score .a{color:var(--a1b)} .score .b{color:var(--a2)}
  .score small{font-size:14px;letter-spacing:.1em;color:var(--muted);font-family:'IBM Plex Sans',sans-serif}
  .cmprow{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .cmprow:first-child{border-top:0}
  .cmprow .val{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;text-align:center}
  .cmprow .val.win{color:var(--gold)}
  .cmprow .mid{min-width:0}
  .cmprow .lab{font-size:13px;color:var(--muted);text-align:center;margin-bottom:4px}
  .dual{display:flex;height:9px;gap:3px}
  .dual .ha,.dual .hb{flex:1;display:flex;background:var(--bg3);border-radius:999px;overflow:hidden}
  .dual .ha{justify-content:flex-end}
  .dual i{display:block;height:100%;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .dual .ha i{background:var(--a1)} .dual .hb i{background:var(--a2)}

  /* rankings */
  .mchips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin:0 -2px;scrollbar-width:thin}
  .mchip{flex:0 0 auto;font-size:14px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);cursor:pointer;white-space:nowrap}
  .mchip.on{background:rgba(var(--a2-rgb),.16);border-color:var(--a2);color:var(--a2)}
  .bars{display:grid;gap:7px;margin-top:6px}
  .bar{display:grid;grid-template-columns:30px minmax(70px,150px) 1fr 50px;gap:8px;align-items:center;padding:3px 0;cursor:pointer;border:0;background:none;color:var(--ink);text-align:left;width:100%;font-size:15px}
  .bar:hover .nm{color:var(--a1b)}
  .bar .no{font-family:'Bebas Neue',sans-serif;font-size:20px;text-align:center;color:var(--a2)}
  .bar.g1 .no,.bar.g2 .no,.bar.g3 .no{color:var(--gold)}
  .bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .tr{height:16px;border-radius:999px;background:var(--bg3);overflow:hidden}
  .bar .tr i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .bar.g1 .tr i{background:linear-gradient(90deg,var(--gold),#ffb300)}
  .bar.me{background:rgba(var(--a1-rgb),.13);border-radius:10px;outline:1px solid rgba(var(--a1-rgb),.55)}
  .bar .vv{font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:right}
  .gap{text-align:center;color:var(--muted);letter-spacing:.3em;font-size:14px}

  /* mapa */
  .selrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .selrow label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;flex:1;min-width:130px}
  select{font:inherit;font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--ink)}
  .scatter .dot{cursor:pointer;transition:r .12s, opacity .12s}
  .scatter .dot:hover{opacity:1}
  .scatter text{fill:var(--muted);font-size:11px;font-family:'IBM Plex Sans',sans-serif}
  .scatter .grid-l{stroke:var(--line);stroke-width:1}
  .scatter .avgl{stroke:rgba(255,255,255,.35);stroke-width:1;stroke-dasharray:4 4}
  .pinfo{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:58px}
  .pinfo b{font-family:'Bebas Neue',sans-serif;font-size:24px}
  .pinfo span{font-size:14px;color:var(--muted)}
  .pinfo .btn{margin-left:auto}

  /* tabla */
  .tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
  table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
  th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:var(--card);color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;user-select:none}
  th.on{color:var(--a2)}
  th:first-child,td:first-child{text-align:center;width:36px}
  th.nm,td.nm{text-align:left}
  td.nm{max-width:170px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:rgba(var(--a1-rgb),.1)}
  tbody tr.me{background:rgba(var(--a1-rgb),.16)}
  td.mono{font-family:'IBM Plex Mono',monospace}
  .posf{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}

  .tip{position:fixed;z-index:100;pointer-events:none;background:#000;border:1px solid var(--a2);color:var(--ink);padding:7px 11px;border-radius:9px;font-size:13px;max-width:240px;opacity:0;transition:opacity .1s;box-shadow:0 6px 20px rgba(0,0,0,.6)}
  .tip.on{opacity:1}
  .credit{text-align:center;color:var(--muted);font-size:13px;margin-top:34px}
  .credit b{color:var(--ink)}
  .sk{height:160px;border-radius:20px;background:linear-gradient(90deg,var(--card),var(--bg2),var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite;margin-top:18px}
  @keyframes sk{to{background-position:-200% 0}}
  .fade{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← Volver a la Copa</a>
  <header>
    <div class="kicker">COPA LUCASPAZO27</div>
    <h1>Centro de <span>estadísticas</span></h1>
    <p class="sub">Buscá tu nick de HaxBall (o el de cualquier jugador), compará y explorá los rankings.</p>
  </header>

  <div class="search" id="search">
    <span class="ic" aria-hidden="true">🔎</span>
    <input id="q" type="text" placeholder="Buscar jugador…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar jugador" disabled>
    <button class="clr" id="clr" type="button" aria-label="Borrar">✕</button>
    <div class="sug" id="sug" role="listbox"></div>
  </div>
  <div class="status" id="status">Cargando jugadores…</div>

  <div class="tabs" id="tabs" hidden>
    <button class="tab" data-v="perfil">👤 Jugador</button>
    <button class="tab" data-v="comparar">⚔️ Comparar</button>
    <button class="tab" data-v="rankings">🏆 Rankings</button>
    <button class="tab" data-v="mapa">🗺️ Mapa</button>
    <button class="tab" data-v="tabla">📋 Tabla</button>
  </div>

  <div id="skel" class="sk"></div>
  <div id="view"></div>
  <div class="credit">Estadísticas creadas por <b>SrNixx</b></div>
</div>
<div class="tip" id="tip"></div>

<script>
(function(){
  var SHEET_ID = '1jU0kDqb4T1KmYEPZADP34Yv3SKMDWgwl';
  var STATS_GID = '202140857';   // hoja con las estadísticas de cada jugador
  var TOP_GID = '350989282';     // hoja del ranking por puntaje (Top, Dorsal, Jugador, Posición, Puntaje Total)
  var REFRESH_MS = 60000;
  var MIN_PJ = 5;                // mínimo de partidos para entrar en promedios y porcentajes
  var C1 = '#FF2E9A', C2 = '#00E5FF';

  var $ = function(id){ return document.getElementById(id); };
  var qEl = $('q'), sugEl = $('sug'), statusEl = $('status'), viewEl = $('view'), skel = $('skel'), searchEl = $('search'), tabsEl = $('tabs'), tipEl = $('tip');
  var REDUCE = false; try{ REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

  function norm(s){
    s = (s || '').toString().trim().toLowerCase();
    try{ s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); }catch(e){}
    return s.replace(/\s+/g, ' ');
  }

    g += '<text x="' + (ml + (W - ml - mr) / 2) + '" y="' + (H - 6) + '" text-anchor="middle" style="fill:var(--a2);font-size:12px">' + esc(X.l) + ' →</text>';
    g += '<text transform="translate(12 ' + (mt + (H - mt - mb) / 2) + ') rotate(-90)" text-anchor="middle" style="fill:var(--a2);font-size:12px">' + esc(Y.l) + ' →</text>';
    var ax = statsOf[X.k].avg, ay = statsOf[Y.k].avg;
    g += '<line class="avgl" x1="' + sx(ax) + '" y1="' + mt + '" x2="' + sx(ax) + '" y2="' + (H - mb) + '"/><line class="avgl" x1="' + ml + '" y1="' + sy(ay) + '" x2="' + (W - mr) + '" y2="' + sy(ay) + '"/>';
    var pmax = Math.max.apply(null, pts.map(function(p){ return p.played || 0; }).concat([1]));
    var cur = S.cur ? byKey[S.cur] : null, sl = S.mapSel ? byKey[S.mapSel] : null;
    pts.slice().sort(function(a, b){ return (a === cur) - (b === cur); }).forEach(function(p){
      var r = has('played') ? 4 + Math.sqrt((p.played || 0) / pmax) * 7 : 6, me = p === cur;
      g += '<circle class="dot" data-k="' + esc(p.key) + '" cx="' + sx(p[X.k]) + '" cy="' + sy(p[Y.k]) + '" r="' + r + '" fill="' + (me ? C1 : C2) + '" fill-opacity="' + (me ? 1 : .55) + '" stroke="' + (me ? '#fff' : '#0A0C0F') + '" stroke-width="' + (me ? 2.5 : 1) + '"/>';
    });
    if(cur && eligible(cur, X) && eligible(cur, Y)) g += '<text x="' + sx(cur[X.k]) + '" y="' + (sy(cur[Y.k]) - 14) + '" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:12px">' + esc(cur.name) + '</text>';
    g += '</svg>';
    h += g + '<div class="hint-line">Línea punteada = promedio del torneo. El tamaño del punto es la cantidad de partidos. ' + (cur ? 'Tu punto está en rosa.' : '') + ' Tocá un punto para ver quién es.</div>' +
      '<div class="pinfo" id="pinfo">' + pinfoHTML(sl, X, Y) + '</div></div>';
    return h;
  }
  function pinfoHTML(p, X, Y){
    if(!p) return '<span>👆 Tocá un punto para ver el jugador.</span>';
    return '<b>' + esc(p.name) + '</b><span>' + X.l + ': <b style="font-size:16px;font-family:IBM Plex Mono,monospace;color:var(--ink)">' + show(X, p[X.k]) + '</b> · ' + Y.l + ': <b style="font-size:16px;font-family:IBM Plex Mono,monospace;color:var(--ink)">' + show(Y, p[Y.k]) + '</b></span><button class="btn pri" data-k="' + esc(p.key) + '">Ver ficha</button>';
  }

  /* ================= VISTA: TABLA ================= */
  var TCOLS = ['played', 'goals', 'assists', 'ga', 'winPct', 'mvp', 'pts'];
  function tableView(){
    var cols = TCOLS.filter(has);
    if(!S.sortK || (S.sortK !== 'name' && S.sortK !== 'pos' && !has(S.sortK))){ S.sortK = has('pts') ? 'pts' : (cols[0] || 'name'); S.sortDir = -1; }
    var poss = []; P.forEach(function(p){ if(p.pos && poss.indexOf(p.pos) < 0) poss.push(p.pos); }); poss.sort();
    var list = P.filter(function(p){ return !S.pos || p.pos === S.pos; });
    var k = S.sortK, d = S.sortDir;
    list.sort(function(a, b){
      var va = k === 'name' ? norm(a.name) : k === 'pos' ? (a.pos || '') : a[k], vb = k === 'name' ? norm(b.name) : k === 'pos' ? (b.pos || '') : b[k];
      if(va === undefined || va === null) return 1; if(vb === undefined || vb === null) return -1;
      if(typeof va === 'string') return d * (va < vb ? -1 : va > vb ? 1 : 0);
      return d * (va - vb);
    });
    var cur = S.cur ? byKey[S.cur] : null;
    var h = '<div class="card fade"><div class="sec">📋 TABLA COMPLETA <small>tocá una columna para ordenar</small></div>';
    if(poss.length > 1) h += '<div class="posf"><button class="mchip ' + (!S.pos ? 'on' : '') + '" data-pos="">Todos</button>' + poss.map(function(x){ return '<button class="mchip ' + (S.pos === x ? 'on' : '') + '" data-pos="' + esc(x) + '">' + esc(x) + '</button>'; }).join('') + '</div>';
    h += '<div class="tw"><table><thead><tr><th>#</th><th class="nm ' + (k === 'name' ? 'on' : '') + '" data-s="name">Jugador' + (k === 'name' ? (d < 0 ? ' ▼' : ' ▲') : '') + '</th>' +
      (poss.length ? '<th class="' + (k === 'pos' ? 'on' : '') + '" data-s="pos">Pos' + (k === 'pos' ? (d < 0 ? ' ▼' : ' ▲') : '') + '</th>' : '') +
      cols.map(function(c){ var m = M[c]; return '<th class="' + (k === c ? 'on' : '') + '" data-s="' + c + '">' + esc({ played:'PJ', goals:'Goles', assists:'Asist', ga:'G+A', winPct:'% Vic', mvp:'MVP', pts:'Pts' }[c]) + (k === c ? (d < 0 ? ' ▼' : ' ▲') : '') + '</th>'; }).join('') +
      '</tr></thead><tbody>' + list.map(function(p, i){
        return '<tr data-k="' + esc(p.key) + '" class="' + (p === cur ? 'me' : '') + '"><td class="mono">' + (i + 1) + '</td><td class="nm">' + esc(p.name) + '</td>' + (poss.length ? '<td>' + esc(p.pos || '–') + '</td>' : '') +
          cols.map(function(c){ var m = M[c], v = val(m, p); if(m.min && !(p.played >= MIN_PJ)) v = null; return '<td class="mono">' + show(m, v) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div></div>';
    return h;
  }

  /* ================= RENDER ================= */
  function animate(){
    // medidores / barras
    var els = viewEl.querySelectorAll('[data-w]');
    if(REDUCE){ Array.prototype.forEach.call(els, function(el){ el.style.width = el.getAttribute('data-w') + '%'; }); }
    else requestAnimationFrame(function(){ requestAnimationFrame(function(){ Array.prototype.forEach.call(els, function(el){ el.style.width = el.getAttribute('data-w') + '%'; }); }); });
    // números que suben
    Array.prototype.forEach.call(viewEl.querySelectorAll('[data-count]'), function(el){
      var to = parseFloat(el.getAttribute('data-count')); if(isNaN(to)) return;
      var d = parseInt(el.getAttribute('data-d') || '0', 10), suf = el.getAttribute('data-suf') || '';
      if(REDUCE) return;
      var t0 = null, dur = 700;
      function step(ts){ if(!t0) t0 = ts; var f = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - f, 3); el.textContent = fmt(to * e, d) + suf; if(f < 1) requestAnimationFrame(step); else el.textContent = fmt(to, d) + suf; }
      requestAnimationFrame(step);
    });
  }
  function render(reset){
    skel.hidden = true;
    var cur = S.cur ? byKey[S.cur] : null;
    if(S.cur && !cur){
      var q0 = S.cur, hit = null;
      for(var ii = 0; ii < P.length && !hit; ii++){ if(P[ii].key.indexOf(q0) === 0) hit = P[ii]; }
      for(var jj = 0; jj < P.length && !hit; jj++){ if(P[jj].key.indexOf(q0) > -1) hit = P[jj]; }
      if(hit){ S.cur = hit.key; cur = hit; qEl.value = hit.name; searchEl.classList.add('has'); pushHash(); } else { S.cur = null; }
    }
    if(S.cmp && !byKey[S.cmp]) S.cmp = null;
    tabsEl.hidden = false;
    var needCur = (S.view === 'perfil' || S.view === 'comparar');
    Array.prototype.forEach.call(tabsEl.children, function(b){
      var v = b.getAttribute('data-v');
      b.classList.toggle('on', v === S.view);
      b.disabled = (v === 'comparar' && !cur);
      b.title = b.disabled ? 'Primero buscá un jugador' : '';
    });
    if(S.view === 'comparar' && !cur) S.view = 'perfil';
    var h;
    if(S.view === 'perfil') h = cur ? profileView(cur) : homeView();
    else if(S.view === 'comparar') h = compareView(cur);
    else if(S.view === 'rankings') h = rankingsView();
    else if(S.view === 'mapa') h = mapView();
    else h = tableView();
    var sy = window.scrollY;
    viewEl.innerHTML = h;
    if(!reset) window.scrollTo(0, sy);
    animate();
    if(S.view === 'comparar') wirePickB();
  }
  function wirePickB(){
    var inp = $('qb'), box = $('sugb'); if(!inp) return;
    var lst = [];
    wireSearch(inp, box, function(){ return lst; }, function(r){ lst = r.filter(function(p){ return p.key !== S.cur; }); }, function(k){ if(k === S.cur) return; S.cmp = k; render(false); pushHash(); });
  }

  /* ================= EVENTOS DE LA VISTA ================= */
  viewEl.addEventListener('click', function(e){
    var t = e.target;
    var act = t.closest('[data-act]');
    if(act){
      var a = act.getAttribute('data-act');
      if(a === 'cmp'){ S.view = 'comparar'; render(true); pushHash(); setTimeout(function(){ var i = $('qb'); if(i) i.focus(); }, 50); }
      else if(a === 'share'){
        var url = location.origin + location.pathname + '#j=' + encodeURIComponent(byKey[S.cur].name);
        var ok = function(){ act.textContent = '✅ Link copiado'; setTimeout(function(){ act.textContent = '🔗 Copiar link'; }, 1800); };
        try{ navigator.clipboard.writeText(url).then(ok, function(){ window.prompt('Copiá el link:', url); }); }catch(err){ window.prompt('Copiá el link:', url); }
      }
      else if(a === 'all'){ S.all = !S.all; render(false); }
      else if(a === 'card'){ makeCard(act); }
      return;
    }
    var mc = t.closest('[data-m]'); if(mc){ S.metric = mc.getAttribute('data-m'); S.all = false; render(false); return; }
    var pf = t.closest('[data-pos]'); if(pf){ S.pos = pf.getAttribute('data-pos'); render(false); return; }
    var th = t.closest('th[data-s]'); if(th){ var k = th.getAttribute('data-s'); if(S.sortK === k) S.sortDir = -S.sortDir; else { S.sortK = k; S.sortDir = (k === 'name' || k === 'pos') ? 1 : -1; } render(false); return; }
    if(S.view === 'mapa'){
      var dot = t.closest('.dot'); if(dot){ S.mapSel = dot.getAttribute('data-k'); var X = M[S.mapX], Y = M[S.mapY]; $('pinfo').innerHTML = pinfoHTML(byKey[S.mapSel], X, Y);
        Array.prototype.forEach.call(viewEl.querySelectorAll('.dot'), function(d){ d.setAttribute('stroke-width', d.getAttribute('data-k') === S.mapSel ? 3 : (d.getAttribute('data-k') === S.cur ? 2.5 : 1)); if(d.getAttribute('data-k') === S.mapSel) d.setAttribute('stroke', '#FFD60A'); else d.setAttribute('stroke', d.getAttribute('data-k') === S.cur ? '#fff' : '#0A0C0F'); });
        return; }
    }
    var k2 = t.closest('[data-k]'); if(k2 && S.view !== 'mapa'){ openPlayer(k2.getAttribute('data-k'), 'perfil'); return; }
    if(k2 && S.view === 'mapa' && k2.tagName === 'BUTTON'){ openPlayer(k2.getAttribute('data-k'), 'perfil'); }
  });
  viewEl.addEventListener('change', function(e){
    if(e.target.id === 'mx'){ S.mapX = e.target.value; S.mapSel = null; render(false); }
    else if(e.target.id === 'my'){ S.mapY = e.target.value; S.mapSel = null; render(false); }
  });
  viewEl.addEventListener('mouseover', function(e){
    if(S.view !== 'mapa') return;
    var dot = e.target.closest && e.target.closest('.dot'); if(!dot) return;
    var p = byKey[dot.getAttribute('data-k')]; if(!p) return;
    showTip(p.name, e.clientX, e.clientY);
  });
  window.addEventListener('hashchange', function(){ readHash(); if(P.length) render(true); });

  /* ================= CARGA ================= */
  function load(first){
    var pS = fetchSheet(STATS_GID, parseStats).then(function(r){ return r; }, function(){ return null; });
    var pT = fetchSheet(TOP_GID, parseTop).then(function(r){ return r; }, function(){ return null; });
    Promise.all([pS, pT]).then(function(res){
      if(!res[0] && !res[1]){
        if(first){ statusEl.textContent = 'No pude leer las estadísticas ahora. Probá de nuevo en un rato.'; statusEl.className = 'status err'; skel.hidden = true; }
        return;
      }
      build(res[0], res[1]);
      var sig = JSON.stringify(P); var changed = sig !== load.sig; load.sig = sig;
      statusEl.className = 'status';
      statusEl.textContent = P.length + ' jugadores · se actualiza solo';
      qEl.disabled = false;
      if(first){ readHash(); if(S.cur && byKey[S.cur]){ qEl.value = byKey[S.cur].name; searchEl.classList.add('has'); } render(true); if(window.innerWidth > 700 && !S.cur) { try{ qEl.focus(); }catch(e){} } }
      else if(changed && (!document.activeElement || document.activeElement.tagName !== 'INPUT')) render(false);
    });
  }
  var st = document.createElement('style'); st.textContent = '@keyframes rpop{from{transform:scale(.15);opacity:0}to{transform:none;opacity:1}}'; document.head.appendChild(st);
  load(true);
  setInterval(function(){ if(!document.hidden) load(false); }, REFRESH_MS);
})();
</script>
</body>
</html>
